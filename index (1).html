<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PNJ Client Brief</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Montserrat:wght@600;800&display=swap">
<style>
/* Layout: sticky step tabs over one working panel with a completion bar; the finished brief is a white paper sheet. */
:root{
  --bg:#F5F5F3; --surface:#FFFFFF; --ink:#141414; --muted:#5A5A55; --line:#DCDBD5;
  --gold:#B8901A; --gold-ink:#7A5C0A; --field:#FFFFFF; --danger:#A12B2B;
  --paper:#FFFFFF; --paper-ink:#141414; --paper-muted:#555550; --paper-line:#D9D7CF; --paper-gold:#7A5C0A;
  --font:'Cairo',Tahoma,Arial,sans-serif; --mono:'Montserrat','Cairo',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0C0C; --surface:#171716; --ink:#F2F1EC; --muted:#A9A8A1; --line:#2D2D2B;
  --gold:#C9A227; --gold-ink:#DDB94B; --field:#101010; --danger:#E27C7C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0C0C; --surface:#171716; --ink:#F2F1EC; --muted:#A9A8A1; --line:#2D2D2B;
  --gold:#C9A227; --gold-ink:#DDB94B; --field:#101010; --danger:#E27C7C; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:900px;margin:0 auto}
.top{background:#0E0E0E;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-left,0px));border-bottom:3px solid #C9A227}
.top .id{display:flex;align-items:center;gap:14px}
.top img{width:52px;height:52px;display:block}
.brand{font-family:var(--mono);font-weight:800;letter-spacing:.32em;color:#C9A227;font-size:18px}
.top h1{margin:0;font-size:18px;font-weight:700;color:#fff}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto}
.tabrow button{flex:0 0 auto;font:inherit;font-weight:700;font-size:15px;padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px}
.tabrow button[aria-selected="true"]{background:#0E0E0E;color:#C9A227;border-color:#C9A227}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--muted);font-weight:600}
.prog .tr{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.prog .fl{height:100%;background:var(--gold);width:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.panel{padding:22px 0 8px}
.panel[hidden]{display:none}
h2{font-size:22px;margin:0 0 4px;font-weight:900}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
label.l,.lbl{font-weight:700;font-size:15px}
.hint{font-size:13.5px;color:var(--muted);margin-top:-2px}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%;min-width:0}
textarea{min-height:92px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:inline-block;padding:9px 15px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:15px;min-height:44px;line-height:1.7}
.chip input:checked + span{background:#0E0E0E;color:#C9A227;border-color:#C9A227}
.chip input:focus-visible + span{outline:3px solid var(--gold);outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.btn{font:inherit;font-weight:800;border-radius:10px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);padding:10px 20px;min-height:46px;cursor:pointer}
.btn.gold{background:#0E0E0E;color:#C9A227;border-color:#C9A227}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.msg{color:var(--gold-ink);font-weight:700}
.scroll{overflow-x:auto}
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;padding:40px 44px;max-width:820px;margin:0 auto;min-width:0;box-shadow:0 6px 30px rgba(0,0,0,.12)}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:3px solid #141414;padding-bottom:14px;flex-wrap:wrap}
.ph .lg{display:flex;align-items:center;gap:14px}
.ph .lg img{width:64px;height:64px;display:block}
.ph .b{font-family:var(--mono);font-weight:800;letter-spacing:.3em;font-size:18px;color:var(--paper-gold)}
.ph .t{font-size:30px;font-weight:900;line-height:1.1}
.ph .m{font-size:14px;color:var(--paper-muted);text-align:end}
.gl{height:3px;background:#B8901A;margin:3px 0 18px}
.sum{border:1.5px solid #141414;border-top:5px solid #B8901A;padding:12px 16px;margin-bottom:6px;break-inside:avoid}
.sum h3{margin:0 0 6px;font-size:16px;font-weight:900;color:var(--paper-gold)}
.sum div{font-size:15px;padding:2px 0}
.sec{margin-top:20px;break-inside:avoid}
.sec h3{margin:0 0 6px;font-size:17px;font-weight:900;background:#141414;color:#C9A227;padding:6px 12px}
.sec table{width:100%;border-collapse:collapse;font-size:15px}
.sec td{border-bottom:1px solid var(--paper-line);padding:7px 10px;vertical-align:top}
.sec td.k{width:34%;font-weight:700;color:var(--paper-muted)}
.sec td.v{white-space:pre-line}
.sec.int h3{background:#F1E7C7;color:#141414}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:24px;color:var(--muted);text-align:center}
.foot{margin-top:24px;font-size:13.5px;color:var(--paper-muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:640px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .paper{padding:22px 16px}
  .top h1{font-size:15px}
  .sec td.k{width:40%}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body::before{display:none}
  .top,.tabs,.panel:not(#p-out),.tools,#p-out .sub{display:none!important}
  .wrap{max-width:none}
  .scroll{overflow:visible}
  .paper{border:0;box-shadow:none;max-width:none;padding:0}
}
</style>

function fieldHtml(f){
  const id='f-'+f.k,v=val(f),dir=f.ltr?' dir="ltr"':'',cls='field'+(f.full?' full':'');
  const hint=f.h?`<span class="hint">${esc(f.h)}</span>`:'';
  if(f.t==='t')return `<div class="${cls}"><label class="l" for="${id}">${f.l}</label>${hint}<input type="text" id="${id}" data-f="${f.k}"${dir} autocomplete="off" value="${esc(v)}"></div>`;
  if(f.t==='a')return `<div class="${cls}"><label class="l" for="${id}">${f.l}</label>${hint}<textarea id="${id}" data-f="${f.k}"${dir}>${esc(v)}</textarea></div>`;
  if(f.t==='s')return `<div class="${cls}"><label class="l" for="${id}">${f.l}</label><select id="${id}" data-f="${f.k}"><option value="">اختر</option>${f.o.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  return `<div class="${cls}"><span class="lbl" id="${id}-l">${f.l}</span><div class="chips" role="group" aria-labelledby="${id}-l">${f.o.map(o=>`<label class="chip"><input type="checkbox" data-m="${f.k}" value="${esc(o)}" ${v.includes(o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div></div>`;
}
function build(){
  $('#tabrow').innerHTML=STEPS.map(s=>`<button role="tab" data-tab="${s.id}" aria-selected="${s.id===cur}">${s.tab}</button>`).join('')+`<button role="tab" data-tab="out" aria-selected="${cur==='out'}">6. البريف النهائي</button>`;
  $('#panels').innerHTML=STEPS.map((s,i)=>{
    const prev=i>0?`<button class="btn" type="button" data-go="${STEPS[i-1].id}">السابق</button>`:'<span></span>';
    const next=i<STEPS.length-1?STEPS[i+1].id:'out',nl=i<STEPS.length-1?'التالي':'عرض البريف';
    return `<section class="panel" id="p-${s.id}" role="tabpanel" ${s.id===cur?'':'hidden'}><h2>${s.title}</h2><p class="sub">${s.sub}</p><div class="grid">${s.f.map(fieldHtml).join('')}</div><div class="nav">${prev}<button class="btn gold" type="button" data-go="${next}">${nl}</button></div></section>`}).join('');
  progress();
}
function progress(){
  const n=COUNTED.filter(has).length,p=Math.round(n/COUNTED.length*100);
  $('#prog-t').textContent=p+'%';$('#prog-f').style.width=p+'%';
}
function show(id){
  cur=id;
  $$('#tabrow button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===id)));
  $$('.panel').forEach(p=>{p.hidden=p.id!=='p-'+id});
  if(id==='out')renderOut();
  window.scrollTo(0,0);
}
const show2=v=>Array.isArray(v)?v.join('، '):v;
function summaryLines(){
  const g=k=>show2(val(FIELDS.find(f=>f.k===k)));

  const who=[g('name'),g('company')].filter(Boolean).join(' - ');
  if(who)l.push(['العميل',who]);
  if(g('mainGoal'))l.push(['الهدف الرئيسي',g('mainGoal')]);
  if(g('services'))l.push(['الخدمات المطلوبة',g('services')]);
  const b=[g('fee')&&('أتعاب: '+g('fee')+' ج.م'),g('adb')&&('إعلانات: '+g('adb')+' ج.م')].filter(Boolean).join(' | ');
  if(b)l.push(['الميزانية الشهرية',b]);
  if(g('start'))l.push(['البدء المطلوب',g('start')]);
  return l;
}

function briefText(){
  const out=['PNJ EGYPT | بريف عميل',`التاريخ: ${dmy(today)}`,''];
  STEPS.forEach(s=>{
    const rows=s.f.filter(f=>has(f)).map(f=>`- ${f.l.replace(' *','')}: ${show2(val(f))}${f.int?' (داخلي)':''}`);
    if(rows.length){out.push('## '+s.title);rows.forEach(r=>out.push(r));out.push('')}
  });
  return out.join('\n');
}

document.addEventListener('click',e=>{
  const tb=e.target.closest('#tabrow button');if(tb){show(tb.dataset.tab);return}
  const go=e.target.closest('[data-go]');if(go){show(go.dataset.go);return}
  if(e.target.id==='pdf-btn'){window.print();return}
  if(e.target.id==='copy-btn'){
    const txt=briefText(),m=$('#msg');
    const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}ta.remove();m.textContent=ok?'تم النسخ':'حدد النص يدوياً وانسخه'};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>{m.textContent='تم النسخ'},fb)}else fb();
    return}
  if(e.target.id==='reset-btn'){
    const b=e.target;
    if(b.dataset.arm){S={};persist();b.textContent='بريف جديد';delete b.dataset.arm;cur='client';build();show('client')}
    else{b.dataset.arm='1';b.textContent='اضغط تاني للتأكيد (هيتمسح كل شيء)';setTimeout(()=>{b.textContent='بريف جديد';delete b.dataset.arm},4000)}
  }
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&t.tagName!=='SELECT'){S[t.dataset.f]=t.value;persist();progress()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f&&t.tagName==='SELECT'){S[t.dataset.f]=t.value;persist();progress();return}
  if(t.dataset.m){const k=t.dataset.m,a=Array.isArray(S[k])?S[k]:[];S[k]=t.checked?a.concat(t.value):a.filter(x=>x!==t.value);persist();progress()}
});
const framed=(()=>{try{return window.top!==window.self}catch(e){return true}})();
if(framed){$('#pdf-hint').textContent='لحفظ PDF: افتح الأداة من ملف على جهازك أو من موقعك الخاص وهيظهر زرار "حفظ PDF / طباعة". هنا تقدر تنسخ البريف كنص أو تاخد لقطة شاشة.'}
